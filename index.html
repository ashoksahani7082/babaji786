<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#f5b400;--orange:#ff7415;--bg:#090604;--muted:#a8a3a0;--panel:#151413;--line:#4b2b17}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff;background:var(--bg)}
body{min-height:100vh;display:flex;justify-content:center;padding:34px 18px 60px;overflow-x:hidden;background:radial-gradient(ellipse at 50% 8%,#321707 0%,#1b0d07 34%,#090604 72%)}
.page{width:min(100%,760px);text-align:center;position:relative}
.brand-logo{display:block;width:min(100%,490px);height:175px;object-fit:contain;margin:4px auto 25px;filter:drop-shadow(0 7px 20px #ff9d0026)}
.kicker{font-size:clamp(27px,5vw,54px);font-weight:900;letter-spacing:1.5px;margin:0;color:#fff}
.script{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:800;font-size:clamp(44px,8vw,76px);line-height:1.12;margin:7px 0 16px;background:linear-gradient(90deg,#ff7517,#ffd12b,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:clamp(13px,2.5vw,24px);font-weight:600;letter-spacing:3px;color:#a7a0a0;margin:0 0 60px}
.download{width:min(100%,730px);min-height:108px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:24px;padding:20px 25px;border-radius:29px;background:linear-gradient(105deg,#ff7415,#ffb900);color:#090604;text-decoration:none;font-size:clamp(19px,3.3vw,32px);font-weight:900;box-shadow:0 14px 40px #ff870033,inset 0 1px #fff8;transition:transform .2s,filter .2s}
.download:hover{transform:translateY(-3px);filter:brightness(1.07)}
.download i{font-size:32px}
.safe{margin:17px 0 60px;color:#aaa4a0;font-size:16px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:35px 18px;background:#151413;border:1.5px solid var(--line);border-radius:30px;box-shadow:0 12px 35px #0004;margin-bottom:42px}
.stat{padding:0 10px;border-right:1px solid #34302d}
.stat:last-child{border:0}
.stat strong{display:block;font-size:clamp(27px,5vw,44px);font-weight:900;line-height:1.2}
.stat strong span{color:var(--orange)}
.stat small{display:block;color:#a8a2a0;font-size:16px;letter-spacing:1px;margin-top:13px}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.feature{min-height:104px;display:flex;align-items:center;gap:22px;text-align:left;padding:20px 22px;border-radius:22px;background:#151413;border:1.5px solid var(--line);box-shadow:0 8px 22px #0003;font-size:20px;font-weight:700;color:#e8e6e5}
.feature-icon{flex:0 0 58px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#482714;color:#ff851c;font-size:24px}
.footer{margin-top:42px;color:#746c67;font-size:12px;letter-spacing:1.2px}
@media(max-width:560px){body{padding:22px 14px 38px}.brand-logo{height:135px;margin-bottom:20px}.tagline{letter-spacing:1.8px;margin-bottom:40px}.download{min-height:78px;border-radius:20px;gap:14px}.download i{font-size:25px}.safe{margin-bottom:42px}.stats{padding:24px 8px;border-radius:22px;margin-bottom:28px}.stat{padding:0 5px}.stat small{font-size:11px;letter-spacing:.5px}.features{gap:12px}.feature{min-height:85px;padding:13px 12px;gap:11px;border-radius:17px;font-size:14px}.feature-icon{flex-basis:42px;width:42px;height:42px;font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <img class="brand-logo" src="./babaji786_logo_transparent.png" alt="Babaji786 logo">
  <h1 class="kicker">BABAJI786</h1>
  <div class="script">MTK Official</div>
  <p class="tagline">YOUR OFFICIAL APP PLATFORM</p>
  <a class="download" href="./Babaji786.apk" download="Babaji786.apk">
    <i class="fa-solid fa-download" aria-hidden="true"></i><span>DOWNLOAD APP NOW</span>
  </a>
  <p class="safe">100% Safe &amp; Secure APK</p>
  <section class="stats" aria-label="Platform highlights">
    <div class="stat"><strong>100K<span>+</span></strong><small>DOWNLOADS</small></div>
    <div class="stat"><strong>100<span>%</span></strong><small>TRUSTED</small></div>
    <div class="stat"><strong>24<span>/</span>7</strong><small>SUPPORT</small></div>
  </section>
  <section class="features" aria-label="Features">
    <div class="feature"><span class="feature-icon"><i class="fa-solid fa-bolt"></i></span><span>Fast Results</span></div>
    <div class="feature"><span class="feature-icon"><i class="fa-regular fa-circle-dollar-to-slot"></i></span><span>Instant Withdraw</span></div>
    <div class="feature"><span class="feature-icon"><i class="fa-solid fa-shield-halved"></i></span><span>100% Secure</span></div>
    <div class="feature"><span class="feature-icon"><i class="fa-solid fa-sparkles"></i></span><span>VIP Experience</span></div>
  </section>
  <p class="footer">BABAJI786 · OFFICIAL APP</p>
</main>
</body>
</html>
